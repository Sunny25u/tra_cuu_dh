<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3ee" />
    <title>Tra cứu đơn hàng</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div class="badge">TRA CỨU ĐƠN HÀNG</div>
        <h1>Tìm đơn hàng của bạn<br /><em> ngay bên dưới.</em></h1>
        <p>Nhập số điện thoại nhận hàng để xem thông tin chi tiết</p>
        <form id="searchForm" class="search">
          <span>⌕</span
          ><input
            id="phone"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Nhập số điện thoại..."
            aria-label="Số điện thoại"
          /><button>Tra cứu</button>
        </form>
        <div id="hint" class="hint">Ví dụ: 0375 128 308</div>
      </section>
      <section id="result" class="result" aria-live="polite"></section>
      <footer>Thông tin được cập nhật từ form ship và dvvc.</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
